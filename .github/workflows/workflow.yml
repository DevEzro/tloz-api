name: DEV TLOZ API

on:
  push:
    branches:
      - dev

env:
  RESULTS_DIR: results

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clone repository
        uses: actions/checkout@v2

      - name: 🐍 Python - Set up
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: 🐍 Python - Instalando paquetes...
        run: |
          pip install -r requirements.txt
                
      - name: 🐍 Python - Ejecutando uvicorn en background
        run: |
          uvicorn app.main:app --reload &
          sleep 5

      - name: 🐍 PYTHON - 🧪 Ejecutando pytests... # Ejecuta los pytests
        run: |
          mkdir -p results
          pytest -s -v --disable-warnings app/tests/test_main.py | tee ${{ env.RESULTS_DIR }}/pytest-results.txt
        continue-on-error: true
      
      - name: 📁 Almanceando resultados... # Almacena los resultados de las pruebas
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: results/