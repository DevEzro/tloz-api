version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: tloz_api_postgres
    environment:
      POSTGRES_USER: ganon
      POSTGRES_PASSWORD: triforce
      POSTGRES_DB: hyrule
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
